575.0938" x="128.2412" y="1635.9873">Encryption established for the named boundary; not a claim of complete security.</text><text fill="#DC2626" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="96.5781" x="17" y="1652.2842">RED [PLAIN]</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="590.3721" x="122.4785" y="1652.2842">Confirmed plaintext protocol or application-visible data; local vs network is labelled.</text><text fill="#D4A000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="135.2354" x="17" y="1668.5811">YELLOW [CHECK]</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="510.4395" x="161.1357" y="1668.5811">Encryption with weak trust/authentication, or protection not established.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="781.9697" x="17" y="1684.8779">Yellow takes precedence over green when a material weakness applies. Unknown does not mean unencrypted.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="756.8203" x="17" y="1701.1748">Storage arrows describe persistence; memory arrows describe processing, not additional network requests.</text><?plantuml-src bLRlRzis4FskluBBlhH072TPMmmfCC1Lt3X8unXDumseyu6MpXONYLH9Agdsr-yT9TcobwmR4CICGzwFT-_UtKzA9tcLad2-pkb8LKKUUULp4d7bl2d8YZzDPJNLuksPiAIzaE9YTYVcruSYCLfJulbGb9Kd8NMAEpb9Hv5ClB5RAzA9E5gQIgVIrk9WLYrpbOZHx7AXfnUNqpyE-COuAgNrAb6bXAE32-dfITPYA2PrQkL2bzOyAgUCLdhDthqrUNWusNquutifl0Rx26FaSzoIgImzsV1YjkSgf2JM5Jc_qBUt4pZDwuIgGbIkVJAFKkdb4ic9Wxd9gu8SRZajIvSPxzhms2rojd9DuTNvhgCOZeQCu49_7btZECT7k7ZHGdOmBihSr4Jufwo0dlJ8UA5bMYWjO5-ZG7LuCkgUR18s9Lc9hnRwmtKC0rcDBu0PBWr5cTLE9RA1x2QAOZ7u-lF9kr-FVudlVnDZSIQ-ZgVnlPXy-JAxFMFd6JjBK0QkwpS6vn27DU8PtbxT7Ge6gcnA-K1rD6Q3v_7fkzDtC3XXWxDFeylflUXAoQR5KYOFfDE57i63iUelC2T9m0sF82qv42uXOPuqMPUfCfAv
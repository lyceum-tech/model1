ngth="18.0908" x="56.5732" y="1312.9341">18</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="37.1592" x="78.6641" y="1312.9341">[ENC]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="115.8232" y="1312.9341">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="46.1284" x="119.9556" y="1312.9341">HTTPS:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="166.084" y="1312.9341">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="62.0928" x="170.2163" y="1312.9341">streamed</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="232.3091" y="1312.9341">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="46.9536" x="236.4414" y="1312.9341">answer</text></g><path d="M968,1331 L968,1386 L2632,1386 L2632,1341 L2622,1331 L968,1331" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2622,1331 L2622,1341 L2632,1341 L2622,1331" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="401.3433" x="1595.0958" y="1348.0669">Processes necessarily see plaintext. Host/admin access is not</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="392.0757" x="1595.0958" y="1363.1997">excluded by TLS. This diagram does not claim every prompt</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="309.6831" x="1595.0958" y="1378.3325">is stored in Redis or queued through RabbitMQ.</text><rect fill="none" height="91.4844" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="791.9697" x="12" y="1404.3984"/><text fill="#16803C" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="102.3408" x="17" y="1422.3936">GREEN [ENC]</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="575.0938" x="128.2412" y="1422.3936">Encryption established for the named boundary; not a claim of complete security.</text><text fill="#DC2626" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="96.5781" x="17" y="1438.6904">RED [PLAIN]</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="590.3721" x="122.4785" y="1438.6904">Confirmed plaintext protocol or application-visible data; local vs network is labelled.</text><text fill="#D4A000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="135.2354" x="17" y="1454.9873">YELLOW [CHECK]</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="510.4395" x="161.1357" y="1454.9873">Encryption with weak trust/authentication, or protection not established.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="781.9697" x="17" y="1471.2842">Yellow takes precedence over green when a material weakness applies. Unknown does not mean unencrypted.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="756.8203" x="17" y="1487.5811">Storage arrows describe persistence; memory arrows describe processing, not additional network requests.</text><?plantuml-src TLRHSjis47pdLrpTbtXYMqxQILDxfZCQHL7SI2ehEubdeZn092oXXW0M02KhNzyzW998P_gYeKW0TxUxjuUVb2bqNKhoOQVbXQhNEWigQ4c3sWUxbex-iRKpSaUlhaYP1-caAIGv-MyjVI1XIcnrKgnbYPU-iiRBJ1J1kkC9mjCWMzZQbCBjw2Il5reLD1tTJE_dff_Va2oNyeIN3LlBHeESFjpTvRS8kyJHVcu6sjObpMf3-sLnrpYhX0kgK9KmWKvkzbdcpZxjvaPK5UA9eAo9o_DdoqjfKFAEUcJTahnq6rL8HBkjAx4GNk93OKrmLclfuWdzh1GX
 of complete security.</text><text fill="#DC2626" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="96.5781" x="17" y="1368.0264">RED [PLAIN]</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="590.3721" x="122.4785" y="1368.0264">Confirmed plaintext protocol or application-visible data; local vs network is labelled.</text><text fill="#D4A000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="135.2354" x="17" y="1384.3232">YELLOW [CHECK]</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="510.4395" x="161.1357" y="1384.3232">Encryption with weak trust/authentication, or protection not established.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="781.9697" x="17" y="1400.6201">Yellow takes precedence over green when a material weakness applies. Unknown does not mean unencrypted.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="756.8203" x="17" y="1416.917">Storage arrows describe persistence; memory arrows describe processing, not additional network requests.</text><?plantuml-src bLRVR-9647xtNp5DNteIa5pk55M9T18o72ND3tJG9j9n3uizWIrcrzrTmz6_lj_OXjXS-j2dUCdEp3SpttopFscJP4NAvCC-uvukDbaKTCYOui87ks57Vzd26TxJnslonMAZ0uqcV-3NHOSSgvIqoOlWEvJO3JwOb4dnZuJrbiaM0Rz5AWdMqTdHPNmtFYFbAOuMjZ2fSdiwcnIBJ2VKdupdvc4qVdWkRmoZNBcW4vqh4-Xif0Blr9xEQHeG7BxcHXLXrH4yb6gVgv2iIikd4yjuGaEpjVkvyJhbHBdorhHzAxR65nd5VKI0jyHksS4YiIOucr6UASEbNRzjzsJT6dcz4M3MlZZypad6OMvsbOLQiWdbnUSJ9A_bNynDxlHMPxpab0IBqeOhzxTjgxg8qm_4wPAHnBqsuqSWOZxsyKDf-1YbAgY5ydn4ZuJNC4bKic8_DvbTUXp5_GiQw4kpmGbACE5S-30tN_ht-FmJVygBeoYAgVlrv_TNlrvyYBzzeY5TqzVXG_oDVflD9jFhYa5wWmfqw0N9WK9ijjfPiq5DEi84IXodE6YLHKFnDeWlhowluEr9l4tk-kE7oXyjLB9cazwGq45C4b15uEDedVw7IuRO7GeNFPMkFlOlBYuEhkBVXl7ltz30nEtpq0G27pXnPdEMkhuYGec6cmMdAPg2VfTsQzGNX6QtGOTyup9fRpCLj3Nq
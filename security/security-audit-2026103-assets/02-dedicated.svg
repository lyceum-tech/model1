"stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="447.2495" x="2722.062" y="1401.5981">Dedicated placement does not exclude host root, provider operators</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="419.5737" x="2722.062" y="1416.731">or hypervisor access. Dynamo caller-auth gap still applies (F08).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="374.0229" x="2722.062" y="1431.8638">Customer responses follow the reverse path in journey 1.</text><rect fill="none" height="91.4844" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="791.9697" x="12" y="1457.9297"/><text fill="#16803C" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="102.3408" x="17" y="1475.9248">GREEN [ENC]</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="575.0938" x="128.2412" y="1475.9248">Encryption established for the named boundary; not a claim of complete security.</text><text fill="#DC2626" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="96.5781" x="17" y="1492.2217">RED [PLAIN]</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="590.3721" x="122.4785" y="1492.2217">Confirmed plaintext protocol or application-visible data; local vs network is labelled.</text><text fill="#D4A000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="135.2354" x="17" y="1508.5186">YELLOW [CHECK]</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="510.4395" x="161.1357" y="1508.5186">Encryption with weak trust/authentication, or protection not established.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust
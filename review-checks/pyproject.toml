[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lyceum-stack-review"
version = "0.1.0"
description = "Run advisory review checks against a GitHub pull request"
requires-python = ">=3.11"
dependencies = ["pyyaml==6.0.3"]

[project.scripts]
stack-review = "review_report:main"
stack-review-runtime = "runtime_agent:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["dev_runtime", "gates", "repository_checks", "review_report", "runtime_agent"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
review_rules = ["policy.json"]
runtime_assets = [
    "Dockerfile",
    "compose.yaml",
    "fake_backend.py",
    "probe.py",
    "lyceum_dev/Dockerfile",
    "lyceum_dev/compose.yaml",
    "lyceum_dev/dev",
]
